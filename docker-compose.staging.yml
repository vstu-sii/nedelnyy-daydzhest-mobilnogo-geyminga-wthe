services:
  web:
    image: artemchuvilini/gaming-digest-web:${IMAGE_TAG:-lab4-test}
    container_name: digest-staging-web
    ports:
      - "8081:80"
    volumes: !override []

  api:
    image: artemchuvilini/gaming-digest-api:${IMAGE_TAG:-lab4-test}
    container_name: digest-staging-api
    build: !reset null
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql://digest_user:${STAGING_DB_PASSWORD}@db:5432/gaming_digest

  db:
    container_name: digest-staging-db
    environment:
      POSTGRES_DB: gaming_digest
      POSTGRES_USER: digest_user
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD}
    volumes: !override
      - staging-postgres-data:/var/lib/postgresql/data
      - ./database/migrations/002_postgresql_schema.sql:/docker-entrypoint-initdb.d/002_postgresql_schema.sql:ro
      - ./database/migrations/003_seed_demo_data.sql:/docker-entrypoint-initdb.d/003_seed_demo_data.sql:ro

volumes:
  staging-postgres-data:

networks:
  digest-network:
    name: digest-staging-network
    driver: bridge