
name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - lab4-delivery

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -v

      - name: Validate Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build images
        run: |
          docker compose -f docker-compose.yml build
          docker build -f Dockerfile.web -t gaming-digest-web:test .

  publish:
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gaming-digest-api:${{ github.ref_name == 'main' && 'latest' || 'lab4-test' }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gaming-digest-api:${{ github.sha }}

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gaming-digest-web:${{ github.ref_name == 'main' && 'latest' || 'lab4-test' }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gaming-digest-web:${{ github.sha }}