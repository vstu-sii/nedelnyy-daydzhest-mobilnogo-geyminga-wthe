name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: |
          test -f README.md
          test -f .gitignore
          test -f .env.example
          test -f compose.yaml
          test -f Makefile
          test -f src/index.html
          test -f .github/PULL_REQUEST_TEMPLATE.md