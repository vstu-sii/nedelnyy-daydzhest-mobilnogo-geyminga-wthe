name: Run Evals

on:
  pull_request:
    branches: [ "main" ]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/evals/requirements.txt

    - name: Run Evals (Mock)
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        cd tests/evals
        python run_evals.py --mock

    # В реальном проекте здесь был бы скрипт проверки порога:
    # Если скрипт run_evals.py возвращает exit code 1 (оценка ниже порога),
    # то CI падает и PR становится красным.
