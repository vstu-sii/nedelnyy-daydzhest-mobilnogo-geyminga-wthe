services:
  web:
    container_name: digest-dev-web

  api:
    container_name: digest-dev-api
    env_file:
      - .env.dev
    environment:
      APP_ENV: development
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    container_name: digest-dev-db
    ports:
      - "5433:5432"
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data

volumes:
  dev-postgres-data: