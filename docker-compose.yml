services:
  web:
    image: nginx:alpine
    container_name: digest-web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./src:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - digest-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digest-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://digest_user:local_dev_password@db:5432/gaming_digest}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - digest-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    image: alpine:3.20
    container_name: digest-worker
    command:
      - /bin/sh
      - -c
      - "touch /tmp/worker-ready; while true; do sleep 3600; done"
    networks:
      - digest-network
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker-ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: digest-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gaming_digest}
      POSTGRES_USER: ${POSTGRES_USER:-digest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations/002_postgresql_schema.sql:/docker-entrypoint-initdb.d/002_postgresql_schema.sql:ro
      - ./database/migrations/003_seed_demo_data.sql:/docker-entrypoint-initdb.d/003_seed_demo_data.sql:ro
    networks:
      - digest-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  digest-network:
    driver: bridge

volumes:
  postgres-data: