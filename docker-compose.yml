
services:
  web:
    image: nginx:alpine
    container_name: digest-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - digest-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  api:
    image: nginx:alpine
    container_name: digest-api
    networks:
      - digest-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  worker:
    image: alpine:3.20
    container_name: digest-worker
    command:
      - /bin/sh
      - -c
      - "touch /tmp/worker-ready; while true; do sleep 3600; done"
    networks:
      - digest-network
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker-ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: digest-db
    environment:
      POSTGRES_DB: gaming_digest
      POSTGRES_USER: digest_user
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - digest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digest_user -d gaming_digest"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  digest-network:
    driver: bridge

volumes:
  postgres-data:
